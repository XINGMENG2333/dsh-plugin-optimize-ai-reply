name: Release

# 打 v* tag（或发布 GitHub Release）时：
#  1. 全量测试
#  2. pnpm pack 产出 dsh-plugin-deai-tone.tgz（改名后上传 Release，供 awesome-dsh-plugin 的 tarball 字段使用）
#  3. 上传 Chrome 扩展 zip
#  4. 配置了 NPM_TOKEN secret 则自动 npm publish（dsh-market 的 npm 源即刻可用）
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Run all tests
        run: |
          node tests/run-tests.js
          node tests/acceptance.js
          node tests/dsh-plugin.test.js

      - name: Build Chrome extension zip
        run: node build.mjs

      - name: Pack DSH bundle tarball
        run: |
          npm pack
          mv dsh-plugin-deai-tone-*.tgz dsh-plugin-deai-tone.tgz

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-plugin-deai-tone.tgz
            deai-plugin-v*.zip
            market/index.json

      - name: Publish to npm (optional, needs NPM_TOKEN secret)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN 未配置，跳过 npm publish（tarball 已上传，用户可从 Release 安装）"
          else
            npm publish --access public
          fi
